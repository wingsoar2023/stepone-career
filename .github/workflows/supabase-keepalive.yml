name: Supabase Keep Alive Trigger

on:
  schedule:
    # Daily at 03:17 UTC — Supabase free tier pauses after 7 days without API activity.
    # Daily (not 2x/week) is intentional: GitHub Actions scheduled runs are known to
    # be delayed or skipped entirely under load; daily keeps the worst-case gap < 2 days.
    - cron: '17 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database via Authenticated REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "❌ Error: VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets must be configured."
            exit 1
          fi
          URL="$SUPABASE_URL"
          KEY="$SUPABASE_KEY"

          echo "Pinging Supabase Database to keep instance active..."
          echo "Target Supabase Host: $URL"

          set +e
          # 1. Ping Auth Service
          auth_code=$(curl -s -S -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 -X GET \
            "${URL}/auth/v1/health" \
            -H "apikey: $KEY")
          auth_exit=$?

          # 2. Ping PostgREST Database API with a VALID query (real Postgres reads count as activity)
          db_code=$(curl -s -S -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 -X GET \
            "${URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          db_exit=$?
          set -e

          echo "Auth API HTTP Code: $auth_code (curl exit: $auth_exit)"
          echo "Database REST HTTP Code: $db_code (curl exit: $db_exit)"

          # Status 200, 206, or 404 (table not yet created) all prove PostgREST & Postgres are active
          if [ "$auth_code" -eq 200 ] || [ "$db_code" -eq 200 ] || [ "$db_code" -eq 404 ]; then
            echo "✅ Supabase keep-alive ping successful! Database activity recorded."
          else
            if [ "$auth_exit" -eq 6 ] || [ "$db_exit" -eq 6 ]; then
              echo "⚠️ Error: Could not resolve hostname ($URL)."
              echo "Your Supabase project may currently be PAUSED due to inactivity."
              echo "To resume: Open https://supabase.com/dashboard and click 'Restore project'."
            else
              echo "⚠️ Warning: Received unexpected status codes (Auth: $auth_code, DB: $db_code)"
            fi
            exit 1
          fi
